<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login -  AI Transformation</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --primary-green: #00FF88; /* สีเขียวนีออน */
            --dark-green: #005f3b;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --glass-bg: rgba(20, 20, 20, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- 1. Canvas พื้นหลัง (Interactive Background) --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* อยู่หลังสุด */
        }

        /* --- 2. การ์ดล็อกอิน (Login Card) --- */
        .login-card {
            position: relative;
            z-index: 10; /* อยู่หน้า Canvas */
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 
                        0 0 15px rgba(0, 255, 136, 0.1); /* เงาเรืองแสงสีเขียว */
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        /* Logo & Header */
        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
            color: var(--primary-green);
            text-shadow: 0 0 10px var(--primary-green);
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-white);
        }

        p.subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* Form Inputs */
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--primary-green);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-green);
            background: rgba(0, 255, 136, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--primary-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            background: #33ff99;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Canvas สำหรับพื้นหลัง -->
    <canvas id="canvas-bg"></canvas>

    <!-- การ์ดล็อกอิน -->
    <div class="login-card">
        <div class="logo">● ■ ▲</div>
        <h2> AI Transformation</h2>
        <p class="subtitle"> องค์ประกอบศิลป์
สัมผัสการเรียนรู้</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Username / รหัสนักศึกษา</label>
                <input type="text" placeholder="กรอกชื่อผู้ใช้งาน" required>
            </div>

            <div class="input-group">
                <label>Password / รหัสผ่าน</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
        </form>
    </div>

    <!-- Script สำหรับทำให้พื้นหลังขยับได้ (Interactive Particles) -->
    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        let particlesArray;

        // ตั้งค่าขนาด Canvas ให้เต็มจอ
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Class สำหรับสร้างจุด (Particle)
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }

            // วาดจุด
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            // อัปเดตตำแหน่ง (ขยับ)
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        // เริ่มต้นสร้างจุด
        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000; // จำนวนจุดตามขนาดจอ

            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 2) - 1; // ความเร็ว X
                let directionY = (Math.random() * 2) - 1; // ความเร็ว Y
                let color = '#00FF88'; // สีเขียว

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // วนลูปเพื่อสร้าง Animation
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        // สร้างเส้นเชื่อมระหว่างจุด (สื่อถึงเส้น - Lines)
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    // ถ้าระยะห่างน้อยกว่าค่าที่กำหนด ให้วาดเส้นเชื่อม
                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = 'rgba(0, 255, 136,' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // ปรับขนาดเมื่อเปลี่ยนขนาดหน้าจอ
        window.addEventListener('resize', function() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            init();
        });

        // เริ่มทำงาน
        init();
        animate();

       // Script ฟอร์มล็อกอิน
const form = document.getElementById('loginForm');
form.addEventListener('submit', function(e) {
    e.preventDefault();

    const btn = this.querySelector('.btn-login');
    btn.innerText = "Processing...";
    btn.style.background = "#fff";
    btn.style.color = "#000";

    // (ถ้าต้องการตรวจสอบ username/password เพิ่มเติม ใส่ตรงนี้)

    setTimeout(() => {
        // เด้งไปหน้าเว็บไซต์หลัก
        window.location.href = "AI Transformation.html"; 
    }, 1000);
});


    </script>
</body>
</html>
